<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>暖信</title>
<!-- iconfont.cn 图标库：替换下方 href 为你的项目链接 -->
<link rel="stylesheet" href="//at.alicdn.com/t/c/font_XXXXXXX.css">
<style>
:root {
  --bg: #FFFEF7;
  --bar: #F7D4AD;
  --card: #FFFEF7;
  --text: #4a3728;
  --text2: #8b7a6a;
  --border: #ede4d0;
  --tab-on: #c89460;
  --tab-off: #b8a080;
  --link: #8b6914;
  --danger: #c0392b;
  --received: #f5f0e8;
}
.icof { width:1em; height:1em; vertical-align:-.15em; fill:currentColor; overflow:hidden; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; background:#FFFEF7; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text); -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased; font-size:15px;
}
#app { width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden; }
@media(min-width:768px){
  #app { flex-direction:row; }
  #tabbar { width:70px; flex-direction:column !important; height:100%; border-right:1px solid var(--border); border-top:none !important; flex-shrink:0; padding-top:8px; }
  #tabbar button { padding:12px 0 !important; font-size:10px !important; }
  #tabbar button .ico { font-size:22px !important; }
  #app .page { flex:1; border-right:1px solid var(--border); max-width:380px; }
  #chat-view { position:relative !important; flex:1; transform:none !important; border-left:1px solid var(--border); }
  #chat-view:not(.open) { display:none; }
  #chat-view.open { display:flex; }
  #chat-view::before { content:'选择一个聊天'; display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--text2); font-size:16px; }
  #chat-view:not(.open) { display:flex; align-items:center; justify-content:center; }
  #chat-view:not(.open)::before { display:block; }
  #chat-view:not(.open) > * { display:none; }
  #chat-view.open::before { display:none; }
  #chat-view.open > * { display:flex; }
  .page { padding-bottom:0 !important; }
  .cv-hd .back { display:none; }
  .input-bar { padding-bottom:8px !important; }
  .modal { max-width:560px; border-radius:14px; }
  .modal-bg { align-items:center; }
  .msg-row { max-width:60%; }
  .ce { height:50vh; }
  .letter-article-body { padding:24px 28px; font-size:16px; line-height:2.2; }
}
@media(min-width:1024px){
  #app .page { max-width:340px; }
  .msg-row { max-width:50%; }
  .modal { max-width:620px; }
  .letter-article-body { max-width:580px; margin:0 auto; }
}
@media(max-width:767px){
  .msg-row { max-width:80%; }
  .msg-bbl { font-size:15px; padding:8px 10px; }
  .modal { border-radius:12px 12px 0 0; max-height:90vh; }
  .ce { height:60vh; flex-direction:column; }
  .ce-l { width:100%; height:auto; max-height:120px; border-right:none; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; overflow-x:auto; }
  .ce-l .gi { flex-shrink:0; white-space:nowrap; }
  .ce-r { min-height:200px; }
}
.hd { height:44px; display:flex; align-items:center; justify-content:center; background:var(--bg); font-size:17px; font-weight:600; flex-shrink:0; padding:0 16px; position:relative; border-bottom:1px solid var(--border); }
.hd .hdr { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:18px; color:var(--text); cursor:pointer; padding:4px 8px; }
.hd .hdl { position:absolute; left:4px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:18px; color:var(--text); cursor:pointer; padding:4px 8px; }
.page { flex:1; overflow-y:auto; display:none; -webkit-overflow-scrolling:touch; padding-bottom:50px; }
.page.on { display:block; }

/* Chat list */
.chat-item { display:flex; align-items:center; padding:12px 16px; gap:10px; cursor:pointer; background:var(--card); border-bottom:1px solid var(--border); }
.chat-item:active { background:#ecd4a0; }
.av { width:44px; height:44px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; color:#fff; overflow:hidden; background:#d9d9d9; }
.av img { width:100%; height:100%; object-fit:cover; }
.ci { flex:1; min-width:0; }
.cn { font-size:15px; margin-bottom:2px; display:flex; align-items:center; gap:4px; }
.cp { font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cm { text-align:right; flex-shrink:0; }
.ct { font-size:11px; color:var(--text2); }
.badge { background:var(--danger); color:#fff; font-size:11px; min-width:18px; height:18px; line-height:18px; border-radius:9px; text-align:center; padding:0 5px; display:inline-block; margin-top:2px; }

/* Contacts */
.cl { font-size:12px; color:var(--text2); padding:4px 16px; background:var(--bg); }
.ct-item { display:flex; align-items:center; padding:10px 16px; gap:10px; cursor:pointer; background:var(--card); border-bottom:1px solid var(--border); }
.ct-item:active { background:#ecd4a0; }

/* Moments */
.m-item { background:var(--card); padding:14px 16px; margin-bottom:8px; }
.m-hd { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.m-av { width:40px; height:40px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:#fff; overflow:hidden; background:#d9d9d9; }
.m-av img { width:100%; height:100%; object-fit:cover; }
.m-name { font-weight:600; font-size:14px; }
.m-time { font-size:11px; color:var(--text2); }
.m-content { font-size:15px; line-height:1.5; margin-bottom:8px; }
.m-img { max-width:100%; border-radius:4px; margin-bottom:8px; }
.m-acts { display:flex; gap:20px; padding-top:6px; border-top:1px solid var(--border); }
.m-acts span { font-size:13px; color:var(--text2); cursor:pointer; }
.m-cmts { margin-top:6px; background:var(--received); padding:6px 10px; font-size:13px; }
.m-cmts .n { font-weight:600; color:var(--link); }

/* Me */
.pf-card { display:flex; align-items:center; gap:14px; padding:24px 16px; background:var(--card); cursor:pointer; margin-bottom:12px; }
.pf-av { width:64px; height:64px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; color:#fff; overflow:hidden; background:#d9d9d9; }
.pf-av img { width:100%; height:100%; object-fit:cover; }
.pf-name { font-size:18px; font-weight:600; }
.pf-st { font-size:12px; color:var(--text2); margin-top:2px; }
.mg { margin-bottom:12px; }
.menu-item { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; background:var(--card); font-size:15px; border-bottom:1px solid var(--border); cursor:pointer; }
.menu-item:active { background:#ecd4a0; }
.menu-item .arr { color:#ccc; font-size:16px; }

/* Chat view */
#chat-view { position:absolute; top:0; left:0; right:0; bottom:0; background:var(--bg); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s ease; z-index:40; }
#chat-view.open { transform:translateX(0); }
.cv-hd { height:44px; display:flex; align-items:center; padding:0 8px; background:var(--bg); border-bottom:1px solid var(--border); gap:4px; flex-shrink:0; }
.cv-hd .back { background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:4px 8px; }
.cv-hd .titles { flex:1; text-align:center; min-width:0; }
.cv-hd .tname { font-weight:600; font-size:16px; }
.cv-hd .ttyping { font-size:13px; color:var(--text2); display:none; }
.cv-hd .ttyping .dots::after { content:''; animation:dots 1.5s steps(4,end) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
.cv-hd .more { background:none; border:none; font-size:20px; color:var(--text); cursor:pointer; padding:4px 8px; }
.msgs { flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
.msg-row { display:flex; gap:6px; max-width:75%; }
.msg-row.me { align-self:flex-end; flex-direction:row-reverse; }
.msg-row.you { align-self:flex-start; }
.msg-bbl { padding:9px 12px; border-radius:6px; font-size:15px; line-height:1.45; word-break:break-word; }
.me .msg-bbl { background:var(--bar); border-top-right-radius:2px; }
.you .msg-bbl { background:#fff; border-top-left-radius:2px; }
.msg-av { width:34px; height:34px; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#fff; overflow:hidden; background:#d9d9d9; align-self:flex-end; }
.msg-av img { width:100%; height:100%; object-fit:cover; }
.msg-nm { font-size:10px; color:var(--text2); margin-bottom:2px; }
.msg-img { max-width:160px; max-height:160px; border-radius:4px; display:block; cursor:pointer; }
.input-bar { padding:8px 10px; background:var(--bg); border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; flex-shrink:0; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
.input-bar textarea { flex:1; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:15px; outline:none; resize:none; background:var(--card); font-family:inherit; max-height:80px; line-height:1.4; }
.input-bar textarea:focus { border-color:var(--tab-on); }
.input-bar .snd { background:var(--tab-on); color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:14px; cursor:pointer; flex-shrink:0; }
.input-bar .snd:active { opacity:.8; }

/* Chat menu dropdown */
.cv-menu { position:absolute; top:44px; right:8px; background:var(--card); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); z-index:25; display:none; min-width:160px; overflow:hidden; }
.cv-menu.show { display:block; }
.cv-menu div { padding:12px 16px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); }
.cv-menu div:last-child { border-bottom:none; }
.cv-menu div:active { background:#ecd4a0; }

/* Tab bar */
#tabbar { display:flex; background:var(--bar); border-top:1px solid var(--border); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom); z-index:30; }
#tabbar button { flex:1; background:none; border:none; padding:6px 0 4px; cursor:pointer; font-size:10px; text-align:center; color:var(--tab-off); }
#tabbar button .ico { font-size:20px; display:block; margin-bottom:1px; }
#tabbar button.on { color:var(--tab-on); }

/* Modal */
.modal-bg { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.4); z-index:100; display:none; align-items:flex-end; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:var(--card); border-radius:12px 12px 0 0; width:100%; max-width:480px; max-height:85vh; display:flex; flex-direction:column; animation:up .25s ease; }
@keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-hd { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg); }
.modal-hd h3 { font-size:15px; font-weight:600; }
.modal-close { background:none; border:none; font-size:18px; color:var(--text2); cursor:pointer; }
.modal-body { flex:1; overflow-y:auto; padding:14px 16px; }
.modal-ft { padding:10px 16px; border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; background:var(--bg); }
.btn { padding:8px 18px; border-radius:6px; font-size:14px; cursor:pointer; border:none; font-family:inherit; font-weight:500; }
.btn-p { background:var(--tab-on); color:#fff; } .btn-p:active { opacity:.8; }
.btn-o { background:transparent; border:1px solid var(--border); color:var(--text); } .btn-o:active { background:#ecd4a0; }
.btn-d { background:var(--danger); color:#fff; } .btn-d:active { opacity:.8; }
.btn-s { padding:4px 10px; font-size:12px; border-radius:4px; }
.fg { margin-bottom:12px; }
.fl { font-size:12px; color:var(--text2); margin-bottom:3px; display:block; }
.fi { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; background:var(--card); font-family:inherit; outline:none; }
.fi:focus { border-color:var(--tab-on); }
.fr { display:flex; gap:6px; align-items:center; }
.fr .fi { flex:1; }

/* Card editor */
.ce { display:flex; height:45vh; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.ce-l { width:110px; border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; background:var(--card); }
.ce-l .gi { padding:10px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border); }
.ce-l .gi.on { background:#ecd4a0; color:#6b3a20; font-weight:600; }
.ce-r { flex:1; overflow-y:auto; padding:8px; }
.card-tag { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); padding:6px 10px; border-radius:8px; margin-bottom:4px; font-size:13px; cursor:pointer; }
.card-tag:active { background:#ecd4a0; }
.card-tag .x { color:var(--danger); font-weight:bold; flex-shrink:0; }
.card-tag img { width:36px; height:36px; border-radius:4px; object-fit:cover; }

/* Call */
#call-v { position:fixed; top:0; left:0; right:0; bottom:0; background:#3a3a3a; z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#fff; }
#call-v.open { display:flex; }
.call-av { width:72px; height:72px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:600; color:#fff; overflow:hidden; background:#555; }
.call-av img { width:100%; height:100%; object-fit:cover; }
.call-nm { font-size:18px; font-weight:600; }
.call-st { font-size:14px; color:#ccc; }
.call-tm { font-size:16px; font-variant-numeric:tabular-nums; }
.call-btns { display:flex; gap:20px; margin-top:20px; }
.call-c { width:52px; height:52px; border-radius:50%; border:none; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.call-end { background:#e74c3c; color:#fff; }
.call-ans { background:var(--tab-on); color:#fff; }
.icall { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:250; background:#fff; border-radius:12px; padding:14px 18px; box-shadow:0 4px 20px rgba(0,0,0,.15); display:none; align-items:center; gap:10px; min-width:260px; }
.icall.show { display:flex; }
.icall .act { display:flex; gap:8px; margin-left:auto; }
.emoji-btn { background:none; border:none; font-size:22px; cursor:pointer; padding:4px 6px; flex-shrink:0; border-radius:6px; }
.emoji-btn:active { background:#ecd4a0; }
.emoji-picker { position:absolute; bottom:56px; left:10px; right:10px; background:var(--card); border-radius:10px; box-shadow:0 -2px 16px rgba(0,0,0,.12); z-index:30; max-height:220px; display:flex; flex-direction:column; overflow:hidden; }
.emoji-picker-hd { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; flex-shrink:0; }
.emoji-picker-body { flex:1; overflow-y:auto; padding:8px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; }
.emoji-close { background:none; border:none; font-size:16px; color:var(--text2); cursor:pointer; }
.emoji-item { font-size:28px; padding:4px; cursor:pointer; border-radius:6px; line-height:1; }
.emoji-item:active { background:#ecd4a0; }
.emoji-item img { width:60px; height:60px; object-fit:cover; border-radius:4px; }
#toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:8px 18px; border-radius:16px; font-size:13px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.show { opacity:1; }
/* Call float bubble */
#callFloat {
  position:fixed; bottom:80px; right:16px; z-index:210;
  background:var(--tab-on); color:#fff; border-radius:24px;
  padding:8px 16px; display:none; align-items:center; gap:8px;
  cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.2);
  font-size:13px; white-space:nowrap;
}
#callFloat.show { display:flex; }
#callFloat .dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:.3} }
.empty { text-align:center; padding:40px 16px; color:var(--text2); font-size:14px; }
/* Letter article */
.letter-article { background:var(--card); border-radius:12px; overflow:hidden; }
.letter-article-hd { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--border); }
.letter-article-av { flex-shrink:0; }
.letter-article-from { font-weight:600; font-size:16px; }
.letter-article-date { margin-left:auto; font-size:12px; color:var(--text2); }
.letter-article-body { padding:20px 18px; font-size:15px; line-height:2; text-indent:2em; color:var(--text); letter-spacing:.5px; white-space:pre-wrap; word-break:break-word; }
.letter-article-body p { margin-bottom:12px; }
.letter-article-orig { margin:0 16px 16px; padding:10px 14px; background:var(--received); border-radius:8px; font-size:12px; color:var(--text2); border-left:3px solid var(--tab-on); }
.letter-article-orig span { font-weight:600; color:var(--text); }
.letter-article-imgs { padding:0 18px 16px; display:flex; flex-wrap:wrap; gap:8px; }
.letter-article-img { max-width:120px; max-height:120px; border-radius:6px; cursor:pointer; object-fit:cover; transition:transform .2s; }
.letter-article-img.zoom { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); max-width:90vw; max-height:90vh; z-index:300; border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.3); }
@media(max-width:480px){
  .letter-article-body { padding:16px 14px; font-size:14px; text-indent:2em; }
  .letter-article-hd { padding:12px; }
  .letter-article-imgs { padding:0 14px 12px; }
}
::-webkit-scrollbar { width:0; }
/* Checkbox list */
.cb-list { max-height:300px; overflow-y:auto; }
.cb-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.cb-item input { width:18px; height:18px; accent-color:var(--tab-on); }
.card-search { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--card); font-family:inherit; outline:none; margin-bottom:8px; }
.card-search:focus { border-color:var(--tab-on); }
.ce-back-top { position:sticky; bottom:8px; float:right; width:36px; height:36px; border-radius:50%; background:var(--tab-on); color:#fff; border:none; font-size:18px; cursor:pointer; display:none; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.2); z-index:10; margin-right:4px; }
.ce-back-top.show { display:flex; }
.ce-r { position:relative; }
</style>
</head>
<body>
<div id="app">
  <!-- Tab: 微信 -->
  <div id="tab-chats" class="page on">
    <div class="hd">微信<button class="hdr" id="btnNewChat">+</button></div>
    <div id="chatList"></div>
  </div>
  <!-- Tab: 通讯录 -->
  <div id="tab-contacts" class="page">
    <div class="hd">通讯录<button class="hdr" id="btnNewCt">+</button></div>
    <div id="ctList"></div>
  </div>
  <!-- Tab: 发现 -->
  <div id="tab-discover" class="page">
    <div class="hd">朋友圈<button class="hdr" id="btnPostMoment"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="22,16 17,11 10,18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
    <div id="momentsFeed"></div>
  </div>
  <!-- Tab: 我 -->
  <div id="tab-me" class="page">
    <div class="pf-card" id="pfCard">
      <div class="pf-av" id="myAv"></div>
      <div><div class="pf-name" id="myNm"></div><div class="pf-st" id="mySt"></div></div>
    </div>
    <div class="mg">
      <div class="menu-item" id="btnCards"><svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px;"><rect x="3" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>字卡库 <span class="arr">›</span></div>
      <div class="menu-item" id="btnLetters"><svg viewBox="0 0 24 24" width="18" height="18" style="margin-right:8px;"><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="2,6 12,14 22,6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>信箱 <span class="arr">›</span></div>

<script>
// ===== DATA =====
const K='wc2';
let D={
  me:{name:'我',avatar:'',status:''},
  cards:{},
  contacts:[],
  msgs:{},
  moments:[],
  letters:[],
  pending:{},
  pendingActive:{},
  bg:{},  // chat backgrounds per contact
  settings:{replyCount:[1,5],callAnswer:0.5,callActiveChance:0.01,statusInterval:5,statusProb:0,letterDays:[1,3],letterReplies:[5,30],momentsLike:0.6,momentsComment:0.3},
  _lastStatus:0,_lastMoments:''
};
let curTab='chats',curChat=null,curGrp=null;
let simTimer=null,callTimer=null;

function sv(){localStorage.setItem(K,JSON.stringify(D));}
function ld(){try{let r=localStorage.getItem(K);if(r)D={...D,...JSON.parse(r)};}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function rd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rf(){return Math.random();}
function pr(a){return a[Math.floor(Math.random()*a.length)];}
function gc(id){return D.contacts.find(c=>c.id===id);}
function gm(id){if(!D.msgs[id])D.msgs[id]=[];return D.msgs[id];}

function avHtml(av,sz,nm){
  let s=sz||34,n=nm||'?';
  if(av) return `<img src="${av}" style="width:${s}px;height:${s}px;border-radius:4px;object-fit:cover;" onerror="this.outerHTML='<span style=display:flex;width:${s}px;height:${s}px;border-radius:4px;background:#d9d9d9;align-items:center;justify-content:center;font-size:${s*0.4}px;color:#fff;font-weight:600;>${n[0]}</span>'">`;
  return `<span style="display:flex;width:${s}px;height:${s}px;border-radius:4px;background:#d9d9d9;align-items:center;justify-content:center;font-size:${s*0.4}px;color:#fff;font-weight:600;">${n[0]}</span>`;
}

function allCards(groups){
  let a=[];
  for(let g of groups){if(D.cards[g])a=a.concat(D.cards[g]);}
  if(!a.length){
    // Fallback: collect all cards from all non-status groups
    let allGs=Object.keys(D.cards).filter(g=>g!=='状态');
    for(let g of allGs){if(D.cards[g])a=a.concat(D.cards[g]);}
  }
  if(!a.length)a=[{type:'text',val:'你好呀~'}];
  return a;
}

function genText(groups){
  let cards=allCards(groups);
  // Emoji分组可以和其他任意字卡组合：将Emoji混入候选池
  let emojiCards=D.cards['Emoji']||[];
  let pool=[...cards,...emojiCards];
  let count=rd(1,Math.min(3,pool.length)),parts=[];
  for(let i=0;i<count;i++)parts.push(pr(pool).val);
  return parts.join(' ');
}

function genMsgs(contact,count){
  let msgs=[];
  let allNonStatus=Object.keys(D.cards).filter(g=>g!=='状态');
  function validGroups(cgs){
    if(!cgs||!cgs.length)return allNonStatus;
    let valid=cgs.filter(g=>D.cards[g]&&D.cards[g].length);
    return valid.length?valid:allNonStatus;
  }
  let groups=contact.isGroup?allNonStatus:validGroups(contact.cardGroups);
  // 对面随机发表情包：30%概率从表情包组选取
  let stickerGroups=D.cards['表情包']&&D.cards['表情包'].length?['表情包']:null;
  let n=Math.min(count,10);
  for(let i=0;i<n;i++){
    let from=contact.name,av=contact.avatar||'',cg=groups;
    if(contact.isGroup&&contact.members&&contact.members.length){
      let m=pr(contact.members);from=m.name;av=m.avatar||'';cg=validGroups(m.cardGroups);
    }
    let useSticker=stickerGroups&&rf()<0.3;
    let cards=allCards(useSticker?stickerGroups:cg);
    // Emoji分组和其他字卡组合：混入候选池一起随机选取
    let emojiCards=D.cards['Emoji']||[];
    let pool=[...cards,...emojiCards];
    let card=pr(pool);
    msgs.push({id:uid(),from,fromAvatar:av,text:card.type==='img'?'[图片]':card.val,time:Date.now(),type:card.type||'text',img:card.type==='img'?card.val:null});
  }
  return msgs;
}

function contactStatus(c){
  if(!c._status){let sc=D.cards['状态']||[];c._status=sc.length?pr(sc).val:'在线';}
  return c._status;
}

// ===== SIMULATION =====
function schedReply(cid,totalCount){
  // Schedule first message after 1-30s; remaining messages follow one-by-one
  let firstDelay=rd(1,30);
  D.pending[cid]={time:Date.now()+firstDelay*1000,cid,remaining:totalCount||1};
  sv();
}
function checkSim(){
  let now=Date.now(),ch=false;
  for(let[cid,p]of Object.entries(D.pending)){
    if(now>=p.time){
      let ct=gc(cid);if(ct){
        let ms=genMsgs(ct,1);
        gm(cid).push(...ms);
      }
      p.remaining--;
      if(p.remaining>0){
        p.time=Date.now()+rd(1,30)*1000;
      }else{
        delete D.pending[cid];
      }
      ch=true;
      if(cid===curChat){renderMsgs();updateTyping();}
      renderChats();
    }
  }
  for(let[cid,p]of Object.entries(D.pendingActive||{})){
    if(now>=p.time){
      let ct=gc(cid);if(ct){let ms=genMsgs(ct,1);gm(cid).push(...ms);}
      p.remaining=(p.remaining||1)-1;
      if(p.remaining>0){
        p.time=Date.now()+rd(1,30)*1000;
      }else{
        delete D.pendingActive[cid];
      }
      ch=true;
      if(cid===curChat){renderMsgs();updateTyping();}
      renderChats();
    }
  }
  let si=(D.settings.statusInterval||5)*3600000;
  if(now-(D._lastStatus||now)>=si){
    D._lastStatus=now;
    let sp=D.settings.statusProb;if(sp===undefined)sp=0;if(rf()<sp){
      let sc=D.cards['状态']||[];
      for(let ct of D.contacts){if(sc.length)ct._status=pr(sc).val;}
      ch=true;
    }
  }
  for(let l of D.letters){
    if(!l.delivered&&now>=l.deliverAt){
      l.delivered=true;let ct=gc(l.toId);
      if(ct)l.replies=genMsgs(ct,rd(D.settings.letterReplies[0],D.settings.letterReplies[1]));
      ch=true;toast('📬 来自「'+l.toName+'」的回信到了！');
    }
  }
  if(rf()<(D.settings.callActiveChance||0.01)*(5/3600)){
    let el=D.contacts.filter(c=>!c.isGroup);
    if(el.length&&!D._activeCall)showIncoming(pr(el));
  }
  if(ch)sv();
}

// ===== RENDER =====
function renderChats(){
  let el=document.getElementById('chatList'),cs=D.contacts;
  if(!cs.length){el.innerHTML='<div class=empty>暂无对话，点击 + 创建</div>';return;}
  let sorted=[...cs].sort((a,b)=>{
    let ma=gm(a.id),mb=gm(b.id);
    return (mb.length?mb[mb.length-1].time:0)-(ma.length?ma[ma.length-1].time:0);
  });
  let h='';
  for(let ct of sorted){
    let ms=gm(ct.id),lm=ms.length?ms[ms.length-1]:null;
    let pv=lm?(lm.type==='img'?'[图片]':lm.text):'';
    let unread=ms.filter(m=>m.from!==D.me.name&&!m._read).length;
    h+=`<div class="chat-item" onclick="openChat('${ct.id}')">
      <div class="av">${avHtml(ct.avatar,44,ct.name)}</div>
      <div class="ci"><div class="cn">${ct.name}${ct.isGroup?'<span style=color:var(--tab-on);font-size:11px;>群</span>':''}</div>
      <div class="cp">${pv||''}</div></div>
      <div class="cm"><div class="ct">${lm?fmtTime(lm.time):''}</div>
      ${unread?'<span class=badge>'+unread+'</span>':''}</div></div>`;
  }
  el.innerHTML=h;
}

function renderCts(){
  let el=document.getElementById('ctList'),sorted=[...D.contacts].sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  let h='',cur='';
  for(let ct of sorted){
    let l=ct.name[0].toUpperCase();
    if(l!==cur){cur=l;h+=`<div class=cl>${cur}</div>`;}
    h+=`<div class="ct-item" onclick="openChat('${ct.id}')">
      <div class="av">${avHtml(ct.avatar,40,ct.name)}</div>
      <div style="flex:1;"><div style="font-size:15px;">${ct.name}</div>
      <div style="font-size:11px;color:var(--text2);">${ct.isGroup?(ct.members||[]).map(m=>m.name).join('、'):contactStatus(ct)}</div></div></div>`;
  }
  if(!sorted.length)h='<div class=empty>暂无联系人，点击 + 添加</div>';
  el.innerHTML=h;
}

function renderMoments(){
  let el=document.getElementById('momentsFeed');
  if(!Array.isArray(D.moments))D.moments=[];
  if(!D.moments.length){el.innerHTML='<div class=empty>暂无动态<br><span style="font-size:12px;">点击右上角📷发一条吧</span></div>';return;}
  let h='';
  for(let i=0;i<D.moments.length;i++){
    let p=D.moments[i],lks=p._likes||[],cms=p._comments||[];
    let isMe=p.author===D.me.name;
    h+=`<div class="m-item">
      <div class="m-hd"><div class="m-av">${avHtml(isMe?D.me.avatar:'',40,p.author)}</div>
      <div><div class="m-name">${p.author}</div><div class="m-time">${p.time||''}</div></div></div>
      <div class="m-content">${p.content}</div>
      ${p.image?`<img src="${p.image}" class="m-img">`:''}
      <div class="m-acts">
        <span onclick="likeMoment('${p._id}')">❤️ ${lks.length||'赞'}</span>
        <span onclick="commentMoment('${p._id}')">💬 ${cms.length||'评论'}</span>
        ${isMe?`<span onclick="editMoment('${p._id}')">✎ 编辑</span><span onclick="deleteMoment('${p._id}')">🗑 删除</span>`:''}
      </div>
      ${cms.length?`<div class="m-cmts">${cms.map(c=>`<div><span class=n>${c.name}</span>: ${c.text}</div>`).join('')}</div>`:''}
    </div>`;
  }
  el.innerHTML=h;
}

function findMoment(id){return D.moments.find(p=>p._id===id);}

function likeMoment(id){
  let p=findMoment(id);if(!p)return;
  if(!p._likes)p._likes=[];
  let me=D.me.name;
  if(p._likes.includes(me)){p._likes=p._likes.filter(n=>n!==me);toast('已取消');}
  else{p._likes.push(me);toast('已点赞');}
  sv();renderMoments();
}

function commentMoment(id){
  let p=findMoment(id);if(!p)return;
  let txt=prompt('写评论：','');if(!txt||!txt.trim())return;
  if(!p._comments)p._comments=[];
  p._comments.push({name:D.me.name,text:txt.trim()});
  sv();renderMoments();toast('已评论');
}
function editMoment(id){
  let p=findMoment(id);if(!p)return;
  let txt=prompt('编辑动态：',p.content);
  if(!txt||!txt.trim())return;
  p.content=txt.trim();sv();renderMoments();toast('已更新');
}
function deleteMoment(id){
  let p=findMoment(id);if(!p)return;
  if(!confirm('确定删除这条动态吗？'))return;
  D.moments=D.moments.filter(x=>x._id!==id);
  sv();renderMoments();toast('已删除');
}

function postMoment(){
  let h=`<div class="fg"><span class="fl">说点什么...</span><textarea class="fi" id="pmCt" rows="4" placeholder="分享你的想法..."></textarea></div>
    <div class="fg"><span class="fl">图片（可选）</span><div id="pmImgPrv"></div><button class="btn btn-o btn-s" id="btnPickPmImg"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;margin-right:2px;"><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="22,16 17,11 10,18" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>选择图片</button></div>`;
  modal(h,`<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="svMoment()">发布</button>`);
  document.getElementById('btnPickPmImg').onclick=async()=>{
    let u=await pickImg(600,600,0.8);
    if(u)document.getElementById('pmImgPrv').innerHTML=`<img src="${u}" style="max-width:100%;max-height:200px;border-radius:4px;margin-top:6px;">`;
    document.getElementById('pmImgPrv').dataset.img=u||'';
  };
}

function svMoment(){
  let ct=document.getElementById('pmCt').value.trim();
  if(!ct){toast('请写点内容');return;}
  let img=document.getElementById('pmImgPrv')?.dataset?.img||'';

function fmtTime(ts){
  let d=new Date(ts),n=new Date();
  let h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===n.toDateString())return h+':'+m;
  let diff=Math.floor((n-d)/86400000);
  if(diff===1)return '昨天';
  if(diff<7)return diff+'天前';
  return (d.getMonth()+1)+'/'+d.getDate();
}

  document.getElementById('call-v').classList.add('open');

  let ad=rd(2,5);
  setTimeout(()=>{
    if(!D._activeCall||D._activeCall.cid!==cid)return;
    if(rf()<(D.settings.callAnswer||0.5)){
      D._activeCall.answered=true;D._activeCall.ansTime=Date.now();
      document.getElementById('callSt').textContent='通话中...';
      document.getElementById('callBtns').innerHTML='<button class="call-c" style="background:#888;color:#fff;" id="btnMinCall">−</button><button class="call-c call-end" id="btnHang">📞</button>';
      document.getElementById('btnHang').onclick=endCall;
      startCallTimer();
    }else{
      document.getElementById('callSt').textContent='对方未接听';
      setTimeout(endCall,2000);
    }
  },ad*1000);
}
function showIncoming(ct){
  if(D._activeCall)return;
  document.getElementById('icallAv').innerHTML=avHtml(ct.avatar,40,ct.name);
  document.getElementById('icallNm').textContent=ct.name;
  document.getElementById('icall').classList.add('show');
  D._activeCall={cid:ct.id,cname:ct.name,start:Date.now(),dir:'in',answered:false,ringing:true};
  document.getElementById('btnAcpt').onclick=()=>{
    document.getElementById('icall').classList.remove('show');
    D._activeCall.answered=true;D._activeCall.ansTime=Date.now();D._activeCall.ringing=false;
    document.getElementById('callAv').innerHTML=avHtml(ct.avatar,72,ct.name);
    document.getElementById('callNm').textContent=ct.name;
    document.getElementById('callSt').textContent='通话中...';
    document.getElementById('callTm').textContent='';
    document.getElementById('callBtns').innerHTML='<button class="call-c" style="background:#888;color:#fff;" id="btnMinCall">−</button><button class="call-c call-end" id="btnHang">📞</button>';
    document.getElementById('btnHang').onclick=endCall;
    document.getElementById('call-v').classList.add('open');
    startCallTimer();
  };
  document.getElementById('btnDecl').onclick=()=>{document.getElementById('icall').classList.remove('show');D._activeCall=null;};
  setTimeout(()=>{if(D._activeCall&&D._activeCall.ringing){document.getElementById('icall').classList.remove('show');D._activeCall=null;}},30000);
}
function startCallTimer(){
  if(callTimer)clearInterval(callTimer);
  callTimer=setInterval(()=>{
    if(!D._activeCall||!D._activeCall.answered)return;
    let e=Math.floor((Date.now()-D._activeCall.ansTime)/1000),m=Math.floor(e/60),s=e%60;
    let ts=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    document.getElementById('callTm').textContent=ts;
    document.getElementById('callFloatTime').textContent='通话中 '+ts;
  },1000);
}
function minimizeCall(){
  document.getElementById('call-v').classList.remove('open');

function restoreCall(){
  document.getElementById('callFloat').classList.remove('show');

}
function endCall(){
  if(callTimer){clearInterval(callTimer);callTimer=null;}
  document.getElementById('call-v').classList.remove('open');

// ===== IMAGE UPLOAD =====
function compressImg(file,mw,mh,q){
  return new Promise(res=>{
    let r=new FileReader();
    r.onload=e=>{
      let img=new Image();
      img.onload=()=>{
        let c=document.createElement('canvas'),w=img.width,h=img.height;
        if(w>mw){h*=mw/w;w=mw;}if(h>mh){w*=mh/h;h=mh;}
        c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function pickImg(mw,mh,q){
  return new Promise(res=>{
    let inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async e=>{
      let f=e.target.files[0];if(!f){res(null);return;}
      res(await compressImg(f,mw||200,mh||200,q||0.7));
    };
    inp.click();
  });
}
function pickMultiImg(mw,mh,q){
  return new Promise(res=>{
    let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
    inp.onchange=async e=>{
      let files=Array.from(e.target.files);if(!files.length){res(null);return;}
      let results=[];
      for(let f of files){results.push(await compressImg(f,mw||300,mh||300,q||0.7));}
      res(results);
    };
    inp.click();
  });
}

function addTextCard(){
  let inp=document.getElementById('newCardTxt');if(!inp)return;
  let txt=inp.value;let lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return;
  if(!D.cards[curGrp])D.cards[curGrp]=[];
  let maxCards=999,cur=D.cards[curGrp].length,remain=maxCards-cur;
  if(remain<=0){toast(`该分组已达上限 ${maxCards} 条`);return;}
  let added=0,skipped=0,over=0;
  for(let line of lines){
    if(added>=remain){over++;continue;}
    if(!D.cards[curGrp].find(c=>c.val===line)){D.cards[curGrp].push({type:'text',val:line});added++;}
    else skipped++;
  }
  sv();renderCardList();
  // 清除文本域内容（重新获取，因为 renderCardList 不会替换 header）
  let newInp=document.getElementById('newCardTxt');
  if(newInp)newInp.value='';
  let msgs=[];
  if(added)msgs.push(`已添加 ${added} 条`);
  if(skipped)msgs.push(`跳过 ${skipped} 条重复`);
  if(over)msgs.push(`${over} 条超出上限被忽略`);
  toast(msgs.length?msgs.join('，'):'全部重复，已跳过');
}

function addGrp(){

function renameGrp(){
  let old=curGrp,n=prompt('重命名：',old);if(!n||!n.trim()||n.trim()===old)return;
  let t=n.trim();if(D.cards[t]){toast('分组名已存在');return;}
  D.cards[t]=D.cards[old];delete D.cards[old];
  for(let ct of D.contacts){
    if(ct.cardGroups&&ct.cardGroups.includes(old))ct.cardGroups=ct.cardGroups.map(g=>g===old?t:g);
    if(ct.members)for(let m of ct.members){if(m.cardGroups&&m.cardGroups.includes(old))m.cardGroups=m.cardGroups.map(g=>g===old?t:g);}
  }
  curGrp=t;sv();closeModal();openCards();
}
function importCardsJSON(){
  let inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    let f=e.target.files[0];if(!f)return;
    let r=new FileReader();
    r.onload=ev=>{
      try{
        let raw=ev.target.result;if(raw.charCodeAt(0)===0xFEFF)raw=raw.slice(1);
        let data=JSON.parse(raw);
        let added=0;
        let maxCards=999;
        let importOne=function(g,val,type){
          if(!val||typeof val!=='string')return;
          if(!D.cards[g])D.cards[g]=[];
          if(D.cards[g].length>=maxCards)return;
          if(!D.cards[g].find(x=>x.val===val)){D.cards[g].push({type:type||'text',val});added++;}
        };
        // 格式1: customReplyGroups [{name, items:[]}] — 从其他app导出的分组字卡
        if(data.customReplyGroups&&Array.isArray(data.customReplyGroups)){
          for(let grp of data.customReplyGroups){
            let g=grp.name||grp.group||'';
            if(!g||!Array.isArray(grp.items))continue;
            for(let item of grp.items){
              if(typeof item==='string')importOne(g,item,'text');
              else if(item&&typeof item==='object')importOne(g,item.val||item.text||'',item.type);
            }
          }
          sv();closeModal();openCards();toast('导入了 '+added+' 条字卡，共 '+data.customReplyGroups.length+' 个分组');
          return;
        }
        // 格式2: [{group, val}, ...] 或纯数组
        if(Array.isArray(data)){
          for(let c of data){
            if(typeof c==='string'){importOne('日常',c,'text');}
            else if(c&&typeof c==='object'){importOne(c.group||c.g||c.name||'日常',c.val||c.text||c.v||c.content||'',c.type);}
          }
        }else if(typeof data==='object'){
          // 格式3: {分组名:["...", {type:"img",val:"..."}, ...]}
          let skipKeys=['exportDate','modules','_groupExport','_groupExportType'];
          for(let[g,cards]of Object.entries(data)){
            if(skipKeys.includes(g))continue;
            if(!Array.isArray(cards))continue;
            for(let c of cards){
              if(typeof c==='string')importOne(g,c,'text');
              else if(c&&typeof c==='object')importOne(g,c.val||c.text||c.content||'',c.type);
            }
          }
        }else{toast('不支持的文件格式');return;}
        sv();closeModal();openCards();toast('导入了 '+added+' 条字卡');
      }catch(x){toast('JSON解析失败：'+x.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}

function delGrp(){

  D.letters.push({id:uid(),toId,toName:con.name,content:ct,sentAt:Date.now(),deliverAt:Date.now()+dd*86400000,delivered:false,replies:[]});

function viewLetterReply(lid){

  let body=paragraphs.length?paragraphs.join('\n\n') : '（图片）';
  let imgHtml=imgs.length?`<div class="letter-article-imgs">${imgs.map(u=>`<img src="${u}" class="letter-article-img" onclick="this.classList.toggle('zoom')">`).join('')}</div>`:'';

    <div class="fg"><span class="fl">回信件数</span><div class="fr"><input class="fi" id="sLrMin" value="${s.letterReplies[0]}" type="number" min="1" style="width:70px;"> - <input class="fi" id="sLrMax" value="${s.letterReplies[1]}" type="number" min="1" style="width:70px;"></div></div>`;
  modal(h,`<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="svSettings()">保存</button>`);
}
function svSettings(){
  D.settings.replyCount=[parseInt(document.getElementById('sCntMin').value)||1,parseInt(document.getElementById('sCntMax').value)||5];
  D.settings.activeDelay=parseInt(document.getElementById('sActive').value)||5;
  D.settings.callAnswer=parseFloat(document.getElementById('sCall').value)||0.5;
  D.settings.callActiveChance=parseFloat(document.getElementById('sCallA').value)||0.01;
  D.settings.statusInterval=parseInt(document.getElementById('sStI').value)||5;
  D.settings.statusProb=parseFloat(document.getElementById('sStP').value)||0.5;
  D.settings.letterDays=[parseInt(document.getElementById('sLtMin').value)||1,parseInt(document.getElementById('sLtMax').value)||7];
  D.settings.letterReplies=[parseInt(document.getElementById('sLrMin').value)||5,parseInt(document.getElementById('sLrMax').value)||30];
  sv();closeModal();toast('设置已保存');
}

// ===== IMPORT/EXPORT =====
function exportData(){
  let out={me:D.me,cards:D.cards,contacts:D.contacts,moments:D.moments,letters:D.letters,settings:D.settings,bg:D.bg};
  let json=JSON.stringify(out,null,2),b=new Blob([json],{type:'application/json'}),u=URL.createObjectURL(b);
  let a=document.createElement('a');a.href=u;a.download='暖信_备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(u);toast('已导出');
}
function importData(){
  let inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();
    r.onload=ev=>{try{let data=JSON.parse(ev.target.result);
      if(data.me)D.me=data.me;if(data.cards)D.cards=data.cards;if(data.contacts)D.contacts=data.contacts;
      if(data.settings)D.settings=data.settings;if(data.moments)D.moments=data.moments;
      if(data.letters)D.letters=data.letters||[];if(data.bg)D.bg=data.bg||{};
      sv();renderAll();toast('导入成功！');
    }catch(x){toast('文件格式错误');}};r.readAsText(f);};inp.click();
}

// ===== MOMENTS AUTO (contacts like/reply within 24h) =====
function momentsCheck(){
  let now=Date.now();
  let personalContacts=D.contacts.filter(c=>!c.isGroup);
  if(!personalContacts.length)return;
  for(let p of D.moments){
    if(!p._createdAt)continue;
    let age=now-p._createdAt;
    if(age>86400000)continue;
    // Likes: 1-5 per post within 24h (仅个人，禁止群聊)
    if(!p._maxLikes)p._maxLikes=rd(1,5);
    if(!p._likes)p._likes=[];
    if(p._likes.length<p._maxLikes&&rf()<0.3){
      let l=pr(personalContacts);
      if(!p._likes.includes(l.name))p._likes.push(l.name);
    }
    // Comments: 1-3 per post within 24h (仅个人，禁止群聊)
    if(!p._maxComments)p._maxComments=rd(1,3);
    if(!p._comments)p._comments=[];
    if(p._comments.length<p._maxComments&&rf()<0.3){
      let cm=pr(personalContacts),cmCards=allCards(Object.keys(D.cards).filter(g=>g!=='状态'));
      p._comments.push({name:cm.name,text:cmCards.length?pr(cmCards).val:'👍'});
    }
  }
  sv();
}

// ===== TOAST =====
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000);}

// ===== TAB =====
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  document.querySelectorAll('#tabbar .tb').forEach(b=>{b.style.color='';b.classList.remove('on');});
  let ab=document.querySelector(`#tabbar .tb[data-tab="${t}"]`);
  if(ab)ab.classList.add('on');
  if(t==='chats')renderChats();
  if(t==='contacts')renderCts();
  if(t==='discover'){momentsCheck();renderMoments();}
  if(t==='me')renderMe();
  closeEmojiPicker();
  if(curChat&&t!=='chats'&&window.innerWidth<768)closeChat();
}
function renderAll(){renderChats();renderCts();renderMoments();renderMe();}

// ===== BIND =====
function bind(){
  document.querySelectorAll('#tabbar .tb').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.getElementById('btnNewChat').addEventListener('click',()=>switchTab('contacts'));
  document.getElementById('btnNewCt').addEventListener('click',openNewCt);
  document.getElementById('btnCvBack').addEventListener('click',closeChat);
  document.getElementById('btnCvCall').addEventListener('click',()=>{if(curChat)startCall(curChat);});
  document.getElementById('btnCvMenu').addEventListener('click',toggleCvMenu);
  document.getElementById('btnSnd').addEventListener('click',sendMsg);
  document.getElementById('btnEmoji').addEventListener('click',toggleEmojiPicker);
  document.getElementById('btnEmojiClose').addEventListener('click',closeEmojiPicker);
  document.getElementById('msgInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  document.getElementById('pfCard').addEventListener('click',editProfile);
  document.getElementById('btnCards').addEventListener('click',openCards);
  document.getElementById('btnLetters').addEventListener('click',openLetters);
  document.getElementById('btnSettings').addEventListener('click',openSettings);
  document.getElementById('btnExport').addEventListener('click',exportData);
  document.getElementById('btnImport').addEventListener('click',importData);
  document.getElementById('btnPostMoment').addEventListener('click',postMoment);
  // Close menu on outside click
  document.addEventListener('click',e=>{if(!e.target.closest('#cvMenu')&&!e.target.closest('#btnCvMenu'))closeCvMenu();if(!e.target.closest('#emojiPicker')&&!e.target.closest('#btnEmoji'))closeEmojiPicker();});
  // Call minimize button (delegated)
  document.getElementById('call-v').addEventListener('click',e=>{if(e.target.id==='btnMinCall')minimizeCall();});
  document.getElementById('chatList').addEventListener('contextmenu',e=>{
    let ci=e.target.closest('.chat-item');if(ci){e.preventDefault();let m=ci.getAttribute('onclick')?.match(/'([^']+)'/);if(m)editCt(m[1]);}
  });
}

  ld();
  if(!D.cards||!Object.keys(D.cards).length)D.cards={'日常':[{type:'text',val:'你好呀~ 🌞'},{type:'text',val:'在干嘛呢？'},{type:'text',val:'今天天气真好 ☀️'},{type:'text',val:'哈哈哈哈哈 😂'},{type:'text',val:'真的假的！'},{type:'text',val:'早点休息哦 🌙'},{type:'text',val:'记得吃饭！'},{type:'text',val:'😊'},{type:'text',val:'😂'},{type:'text',val:'🥰'},{type:'text',val:'[贴贴]'},{type:'text',val:'[暗中观察]'}],'Emoji':[{type:'text',val:'😂'},{type:'text',val:'😊'},{type:'text',val:'🥰'},{type:'text',val:'😭'},{type:'text',val:'🤣'},{type:'text',val:'😡'},{type:'text',val:'👍'},{type:'text',val:'❤️'},{type:'text',val:'🔥'},{type:'text',val:'👀'},{type:'text',val:'💪'},{type:'text',val:'🙏'},{type:'text',val:'😅'},{type:'text',val:'🥺'},{type:'text',val:'😎'},{type:'text',val:'🤔'},{type:'text',val:'😋'},{type:'text',val:'💕'},{type:'text',val:'✨'},{type:'text',val:'🎉'}],'表情包':[{type:'text',val:'😂'},{type:'text',val:'😊'},{type:'text',val:'🥰'},{type:'text',val:'😭'},{type:'text',val:'🤣'},{type:'text',val:'😡'},{type:'text',val:'👍'},{type:'text',val:'❤️'},{type:'text',val:'[贴贴]'},{type:'text',val:'[暗中观察]'},{type:'text',val:'[裂开]'},{type:'text',val:'[狗头]'}],'状态':[{type:'text',val:'在线'},{type:'text',val:'摸鱼中 🐟'},{type:'text',val:'忙碌中...'},{type:'text',val:'睡觉中 😴'},{type:'text',val:'元气满满 ✨'},{type:'text',val:'搬砖中 🧱'}]};
  // 确保 Emoji 分组存在（迁移旧数据）
  if(!D.cards['Emoji']){D.cards['Emoji']=[];sv();}
  if(!D.contacts||!D.contacts.length){let allGs=Object.keys(D.cards).filter(g=>g!=='状态');D.contacts=[{id:'c1',name:'小明',avatar:'',cardGroups:allGs},{id:'c2',name:'小红',avatar:'',cardGroups:allGs},{id:'c3',name:'阿杰',avatar:'',cardGroups:allGs}];}
  if(!D.settings)D.settings={replyCount:[1,5],activeDelay:5,callAnswer:0.5,callActiveChance:0.01,statusInterval:5,statusProb:0,letterDays:[1,3],letterReplies:[5,30],momentsLike:0.6,momentsComment:0.3};
  if(!D.moments)D.moments=[];
  if(!D.letters)D.letters=[];
  if(!D.pending)D.pending={};
  if(!D.pendingActive)D.pendingActive={};
  if(!D.bg)D.bg={};
  if(!D._lastStatus)D._lastStatus=Date.now();
  let sc=D.cards['状态']||[];
  for(let ct of D.contacts){if(!ct._status)ct._status=sc.length?pr(sc).val:'在线';}
  for(let p of D.moments){if(!p._id)p._id=uid();if(!p._likes)p._likes=[];if(!p._comments)p._comments=[];if(!p._createdAt)p._createdAt=Date.now();}
  if(!D.msgs||typeof D.msgs!=='object')D.msgs={};
  for(let ms of Object.values(D.msgs)){for(let m of ms){if(m._read===undefined)m._read=true;}}
  // 清理已删除联系人的残留 pending
  for(let cid of Object.keys(D.pending)){if(!gc(cid))delete D.pending[cid];}
  for(let cid of Object.keys(D.pendingActive||{})){if(!gc(cid))delete D.pendingActive[cid];}
  // 确保关键字段类型正确
  if(!Array.isArray(D.moments))D.moments=[];
  if(!Array.isArray(D.contacts))D.contacts=[];
  sv();renderAll();bind();
  checkSim(); // 立即处理过期pending，防卡"正在输入"
  simTimer=setInterval(checkSim,5000);
  momentsCheck();
}
init();

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){checkSim();momentsCheck();if(curTab==='chats')renderChats();if(curTab==='discover')renderMoments();if(curChat){renderMsgs();updateTyping();}}
});
</script>
